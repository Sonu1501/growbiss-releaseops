
services:
  support-api:
    build:
      context: .
      dockerfile: src/GrowBiss.SupportApi/Dockerfile

    image: growbiss/support-api:1.0.0

    container_name: growbiss-support-api

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

    ports:
      - "5081:8080"

    restart: unless-stopped
