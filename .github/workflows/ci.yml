
name: GrowBiss ReleaseOps CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releaseops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================
  # JOB 1: BUILD AND TEST
  # =========================================
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore NuGet dependencies
        run: dotnet restore ./GrowBiss.ReleaseOps.sln

      - name: Build solution
        run: >
          dotnet build ./GrowBiss.ReleaseOps.sln
          --configuration Release
          --no-restore

      - name: Run automated unit tests
        run: >
          dotnet test ./GrowBiss.ReleaseOps.sln
          --configuration Release
          --no-build
          --verbosity normal


  # =========================================
  # JOB 2: DOCKER BUILD, SECURITY AND ECR
  # =========================================
  container-build-and-scan:
    name: Docker Build, Security Scan and ECR Push
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 30

    # OIDC permission is needed to assume the AWS IAM role.
    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      # -------------------------------------
      # Docker image build
      # -------------------------------------
      - name: Build Docker image
        run: >
          docker build
          --pull
          --file src/GrowBiss.SupportApi/Dockerfile
          --tag growbiss/support-api:${{ github.sha }}
          .

      # -------------------------------------
      # Security scanning
      # -------------------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: growbiss/support-api:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # -------------------------------------
      # AWS Authentication
      # Publish only from main branch pushes
      # -------------------------------------
      - name: Configure AWS credentials using OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::783764581182:role/GrowBissReleaseOpsECRPushRole
          aws-region: us-east-2
          allowed-account-ids: '783764581182'
          role-session-name: GrowBissReleaseOps-${{ github.run_id }}

      # -------------------------------------
      # Verify AWS identity
      # -------------------------------------
      - name: Verify AWS identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      # -------------------------------------
      # ECR Authentication
      # -------------------------------------
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      # -------------------------------------
      # Prepare image tag and push to ECR
      # -------------------------------------
      - name: Push Docker image to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: growbiss/support-api
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

        run: |
          echo "Tagging the scanned Docker image..."

          docker tag \
            growbiss/support-api:${GITHUB_SHA} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "Pushing Docker image to Amazon ECR..."

          docker push \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "Successfully published GrowBiss Support API."

          echo "Image URI:"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
