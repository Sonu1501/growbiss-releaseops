
name: GrowBiss ReleaseOps CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releaseops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================
  # JOB 1: BUILD AND TEST
  # =========================================
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./GrowBiss.ReleaseOps.sln

      - name: Build solution
        run: >
          dotnet build ./GrowBiss.ReleaseOps.sln
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test ./GrowBiss.ReleaseOps.sln
          --configuration Release
          --no-build
          --verbosity normal

  # =========================================
  # JOB 2: DOCKER BUILD, TRIVY AND GHCR
  # =========================================
  container-build-and-scan:
    name: Docker Build, Security Scan and GHCR
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build --pull \
            --file src/GrowBiss.SupportApi/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag growbiss/support-api:${GITHUB_SHA} \
            .

      # Security scan
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: growbiss/support-api:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

      # Publish image
      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          IMAGE="ghcr.io/${OWNER}/growbiss-support-api"

          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker tag \
            "growbiss/support-api:${GITHUB_SHA}" \
            "${IMAGE}:${TAG}"

          docker push "${IMAGE}:${TAG}"

          echo "## GrowBiss Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
